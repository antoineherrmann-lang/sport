<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sport</title>
<meta name="theme-color" content="#0086ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sport">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,600;1,700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --radius-s:8px; --radius-m:12px; --radius-l:16px;
  --nav-h:59px;
  --nav-margin:2px;
  /* Palette 100% plate, sans dégradé, dérivée de l'icône Sport et de l'identité éditoriale */
  --blue:#0086ff;
  --red:#ff2d3e;
  --green:#1f8147;
  --ink:#0a0a0a;
}
:root[data-theme="dark"]{
  --bg:#0a0a0a;
  --text:#f4f3ee;
  --text-dim:#9a9a93;
  --border: rgba(244,243,238,.16);
  --border-strong: rgba(244,243,238,.5);
  --bg-elevated:#141414;
  --bg-card:#141414;
  --bg-input:#1c1c1c;
  --accent: var(--blue);
  --accent-2: var(--red);
  --accent-dim: rgba(0,134,255,.16);
  --accent-dim-2: rgba(0,134,255,.3);
  --shadow-hard: 4px 4px 0 var(--blue);
  --shadow-hard-red: 4px 4px 0 var(--red);
  --nav-bg: var(--text);
  --nav-fg: var(--text);
  --glass-bg: rgba(20,20,20,.55);
  --glass-border: rgba(244,243,238,.22);
  --glass-shadow: 0 8px 24px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#f0efe9;
  --text:#0a0a0a;
  --text-dim:#69695f;
  --border: rgba(10,10,10,.16);
  --border-strong: rgba(10,10,10,.85);
  --bg-elevated:#ffffff;
  --bg-card:#ffffff;
  --bg-input:#f0efe9;
  --accent: var(--blue);
  --accent-2: var(--red);
  --accent-dim: rgba(0,134,255,.1);
  --accent-dim-2: rgba(0,134,255,.22);
  --shadow-hard: 4px 4px 0 var(--ink);
  --shadow-hard-red: 4px 4px 0 var(--red);
  --nav-bg: var(--ink);
  --nav-fg: var(--text);
  --glass-bg: rgba(255,255,255,.32);
  --glass-border: rgba(255,255,255,.55);
  --glass-shadow: 0 10px 28px rgba(10,10,10,.18), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(10,10,10,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  position:relative;
}

#app{
  max-width:560px; margin:0 auto; min-height:100vh; position:relative;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(var(--nav-h) + var(--nav-margin)*2 + 20px + env(safe-area-inset-bottom));
}
.pagehead{
  padding:22px 18px 6px;
}
.pagehead > span{
  font-family:'Anton',sans-serif; font-size:clamp(28px, 9vw, 38px); font-weight:400; letter-spacing:.2px; line-height:1;
  text-transform:uppercase; color:var(--text); display:block;
}
.title-letter{
  display:inline-block; opacity:0; transform:translateY(var(--rise,14px));
  animation:titleLetterIn .42s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes titleLetterIn{
  to{opacity:1; transform:translateY(0);}
}
.icon-btn{
  width:42px; height:42px; min-width:42px; min-height:42px; border-radius:50%; border:2px solid var(--border-strong);
  background:var(--bg-card); color:var(--text); display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:3px 3px 0 var(--border-strong); flex-shrink:0; box-sizing:border-box;
  transition:transform .12s, box-shadow .12s;
}
.icon-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--border-strong);}
.icon-btn svg{width:20px; height:20px; flex-shrink:0;}
.icon-btn.spinning svg{animation:spin .8s linear infinite;}
.spin-wrap{display:inline-flex; width:16px; height:16px;}
.spin-wrap svg{width:16px; height:16px;}
.btn.spinning .spin-wrap svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
main{padding:18px;}
.screen{}
.enter-block{animation:blockIn .38s cubic-bezier(.22,1,.36,1) backwards;}
@keyframes blockIn{from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.reveal-in{animation:revealIn .32s cubic-bezier(.22,1,.36,1);}
@keyframes revealIn{from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* Hero */
.home-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:6px 2px 16px;
}
.home-logo{
  color:var(--ink);
}
.home-logo svg{width:142px; height:auto; display:block; fill:currentColor;}
.hero-settings{
  flex-shrink:0;
  background:#fff; color:var(--ink); border-color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);
}
.hero-settings:active{box-shadow:1px 1px 0 var(--ink);}
.hero-logo{
  flex:1; min-width:0; display:flex; justify-content:center;
  color:#fff;
}
.hero-logo svg{width:168px; max-width:100%; height:auto; display:block; fill:currentColor;}

.card{
  background:var(--bg-card); border:2px solid var(--border-strong); border-radius:var(--radius-m);
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow-hard);
}
.card-live{position:relative; overflow:hidden; border-color:var(--blue); box-shadow:4px 4px 0 var(--blue); background:var(--accent-dim);}
.card-live::before{
  content:""; position:absolute; top:0; left:0; width:100px; height:100px; pointer-events:none; z-index:0;
  background-image:radial-gradient(var(--blue) 1.5px, transparent 1.8px);
  background-size:13px 13px; opacity:.4;
  -webkit-mask-image:radial-gradient(circle at 0% 0%, black, transparent 68%);
  mask-image:radial-gradient(circle at 0% 0%, black, transparent 68%);
  animation:heroDots 10s linear infinite;
}
.card-live > *{position:relative; z-index:1;}
@keyframes heroDots{
  0%{background-position:0 0;}
  100%{background-position:130px 65px;}
}
.live-dot{
  display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--blue);
  margin-right:7px; vertical-align:middle; animation:livePulse 1.6s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{opacity:1; transform:scale(1);}
  50%{opacity:.35; transform:scale(1.35);}
}
.card h2{font-family:'Anton',sans-serif; font-size:17px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.3px; font-weight:400; color:var(--text);}
.row-stats{display:flex; gap:10px;}
.stat{flex:1; text-align:center; background:var(--bg-input); border-radius:var(--radius-s); padding:12px 6px; border:2px solid var(--border);}
.stat b{display:block; font-size:22px; font-family:'Anton',sans-serif; font-weight:400;}
.stat span{font-size:11px; color:var(--text-dim); font-weight:600;}

.grid-machines{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.machine-pr{
  background:var(--bg-input); border-radius:var(--radius-s); padding:10px 12px; border:2px solid var(--border);
}
.machine-pr .name{font-size:12px; color:var(--text-dim); display:block; margin-bottom:2px; font-weight:600;}
.machine-pr .val{font-size:18px; font-weight:700; font-family:'IBM Plex Mono',monospace;}

.activity-item{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:2px solid var(--border);
}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid var(--border-strong);}
.activity-dot svg{width:16px; height:16px;}
.activity-dot.gym{background:var(--accent-dim); color:var(--accent);}
.activity-dot.run{background:rgba(255,45,62,.14); color:var(--accent-2);}
.activity-main{flex:1; min-width:0;}
.activity-title{font-weight:700; font-size:14px;}
.activity-sub{font-size:12px; color:var(--text-dim);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:2px solid var(--ink); border-radius:var(--radius-s); padding:13px 18px; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; width:100%; transition:transform .12s, box-shadow .12s;
  box-shadow:3px 3px 0 var(--ink);
}
:root[data-theme="dark"] .btn{border-color:var(--text); box-shadow:3px 3px 0 var(--text);}
.btn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--ink);}
:root[data-theme="dark"] .btn:active{box-shadow:0 0 0 var(--text);}
.btn-primary{background:var(--blue); color:#fff;}
.btn-secondary{background:var(--bg-card); color:var(--text);}
.btn-ghost{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}
:root[data-theme="dark"] .btn-ghost{box-shadow:3px 3px 0 var(--accent);}
.btn-ghost:active{box-shadow:0 0 0 var(--accent) !important;}
.btn-cancel{background:transparent; color:var(--text-dim); border-color:var(--border-strong); box-shadow:none; text-decoration:underline; text-underline-offset:3px;}
.btn-cancel:active{transform:none; box-shadow:none; opacity:.6;}
.btn-row{display:flex; gap:10px; margin-bottom:14px;}
.btn-row-3070{display:flex; gap:10px; margin-bottom:14px;}
.btn-row-3070 > *:first-child{flex:0.3 1 0%; width:auto;}
.btn-row-3070 > *:last-child{flex:0.7 1 0%; width:auto;}
.btn-row .btn{width:auto; flex:1;}

label.field-label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
.field{margin-bottom:14px; min-width:0;}
input[type=text], input[type=number], input[type=date], select{
  width:100%; max-width:100%; min-width:0; box-sizing:border-box;
  padding:12px 14px; border-radius:var(--radius-s); border:2px solid var(--border-strong);
  background:var(--bg-input); color:var(--text); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; outline:none;
}
input[type=date]{
  -webkit-appearance:none; appearance:none;
}
@media (max-width:380px){
  input[type=date]{font-size:13px; padding:12px 8px;}
}
input:focus, select:focus{border-color:var(--accent);}

.choice-group{display:flex; flex-wrap:wrap; gap:8px;}
.choice{
  padding:9px 14px; border-radius:999px; border:2px solid var(--border-strong); background:var(--bg-input);
  color:var(--text-dim); font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; cursor:pointer;
}
.choice.active{background:var(--accent); border-color:var(--ink); color:#fff;}
:root[data-theme="dark"] .choice.active{border-color:var(--text);}

.exercise-row{
  display:grid; grid-template-columns:minmax(0,1fr) 58px 50px 50px 26px; gap:6px; align-items:center; margin-bottom:12px;
}
.exercise-row .ex-name{font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:4px;}
.exercise-row input{padding:11px 4px; font-size:15px; text-align:center; font-weight:700;}
.ex-remove{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--border); background:var(--bg-input);
  color:var(--text-dim); font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
}
.ex-head{display:grid; grid-template-columns:minmax(0,1fr) 58px 50px 50px 26px; gap:6px; margin-bottom:8px;}
.ex-head span{font-size:9px; color:var(--text-dim); text-align:center; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700;}
.ex-head span:first-child{text-align:left;}
.add-machine-row{display:flex; gap:8px; margin:10px 0 4px;}
.add-machine-row input{flex:1; min-width:0;}
.add-machine-row .btn{width:auto; white-space:nowrap; padding:10px 14px; font-size:13px;}
.machine-manage-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:2px solid var(--border);}
.machine-manage-row:last-child{border-bottom:none;}
.mm-name{font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mm-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.mm-toggle{
  font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px;
  border:2px solid var(--border); background:var(--bg-input); color:var(--text-dim); cursor:pointer;
}
.mm-toggle.on{background:var(--blue); border-color:var(--blue); color:#fff;}

.history-item{
  padding:12px; margin-bottom:10px; border:2px solid var(--border); border-radius:var(--radius-s);
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  cursor:pointer; transition:border-color .12s, transform .12s;
}
.history-item:active{transform:scale(.98);}
.history-item:hover{border-color:var(--border-strong);}
.history-main{flex:1; min-width:0;}
.history-actions{display:flex; align-items:center; gap:2px; flex-shrink:0;}
.history-date{font-weight:700; font-size:13px;}
.history-detail{font-size:12px; color:var(--text-dim); margin-top:3px; font-family:'IBM Plex Mono',monospace; overflow-wrap:break-word;}
.del-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; flex-shrink:0; padding:8px; margin:-8px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.del-btn:active{background:var(--bg-input);}
.del-btn svg{width:16px; height:16px;}

.tag{display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:4px 9px; border-radius:5px; background:var(--accent); color:#fff; margin-right:6px;}
.tag svg{width:11px; height:11px; vertical-align:middle; display:inline-block;}
.tag.alt{background:var(--bg-input); color:var(--text-dim); border:2px solid var(--border);}

.program-card{
  background:var(--bg-card); border:2px solid var(--border-strong); border-radius:var(--radius-m); padding:16px; margin-bottom:14px;
  box-shadow:var(--shadow-hard);
}
.program-head{display:flex; align-items:flex-start; margin-bottom:10px; gap:10px;}
.program-head-main{flex:1; min-width:0;}
.program-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.reorder-col{display:flex; flex-direction:column; gap:4px; flex-shrink:0;}
.reorder-btn{
  width:28px; height:22px; border-radius:6px; border:2px solid var(--border); background:var(--bg-input);
  color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
}
.reorder-btn svg{width:14px; height:14px;}
.reorder-btn:disabled{opacity:.25; cursor:default;}
.reorder-btn:active:not(:disabled){transform:scale(.9);}
.program-actions .del-btn{
  width:28px; height:48px; border-radius:6px; border:2px solid var(--border); background:var(--bg-input);
  color:var(--text-dim); padding:0; margin:0;
}
.program-actions .del-btn:active{background:var(--bg-input); transform:scale(.95);}
.program-actions .del-btn svg{width:15px; height:15px;}
.program-actions .edit-program-btn{
  width:28px; height:48px; border-radius:6px; border:2px solid var(--border); background:var(--bg-input);
  color:var(--text-dim); padding:0; margin:0; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.program-actions .edit-program-btn:active{transform:scale(.95);}
.program-actions .edit-program-btn svg{width:15px; height:15px;}
.step-edit-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
.step-edit-row input{flex:1;}
.step-detail-row{display:flex; gap:6px; margin:0 0 12px; padding-left:2px;}
.step-detail-row input{flex:1; min-width:0; padding:8px 6px; font-size:12px; text-align:center;}
.step-remove{
  width:32px; height:32px; flex-shrink:0; border-radius:50%; border:2px solid var(--border-strong);
  background:var(--bg-input); color:var(--text-dim); cursor:pointer; font-size:14px;
}
.program-title{font-family:'Anton',sans-serif; font-size:18px; font-weight:400; margin:0 0 4px; text-transform:uppercase;}
.program-count{font-size:11px; color:var(--text-dim); font-weight:600;}
.step{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:2px solid var(--border);}
.step:last-child{border-bottom:none;}
.step-body{flex:1; min-width:0; padding-top:2px;}
.step-meta{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
.step-chip{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  background:var(--bg-input); color:var(--text-dim); border:1px solid var(--border); border-radius:6px; padding:3px 8px;
}
.step-check{width:30px; height:30px; border-radius:8px; border:2px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--bg-input); transition:transform .15s;}
.step-bullet{width:30px; height:30px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.step-bullet::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--text-dim);}
.program-preview{cursor:pointer;}
.step-check.done{background:var(--green); border-color:var(--green); animation:checkPop .28s cubic-bezier(.34,1.56,.4,1);}
@keyframes checkPop{
  0%{transform:scale(.7);}
  60%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
.step-check svg{width:17px; height:17px; opacity:0;}
.step-check.done svg{opacity:1;}
.step-label{font-size:14px; flex:1; font-weight:500;}
.step.done .step-label{color:var(--text-dim); text-decoration:line-through;}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:2px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-size:14px; font-weight:700;}
.settings-row .val{font-size:13px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;}

details.changelog-group{margin-bottom:10px;}
details.changelog-group summary{font-weight:800; font-size:13px; cursor:pointer; padding:8px 0; color:var(--text-dim);}
.changelog-entry{margin-bottom:12px;}
.changelog-entry .v{font-weight:800; font-size:13px; font-family:'IBM Plex Mono',monospace;}
.changelog-entry ul{margin:4px 0 0; padding-left:18px; font-size:13px; color:var(--text-dim);}

.toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--nav-margin)*2 + 16px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px) scale(.9); background:var(--glass-bg); border:1px solid var(--glass-border);
  color:var(--text); padding:11px 18px 11px 16px; border-radius:999px; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;
  box-shadow:var(--glass-shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease;
  max-width:90%; text-align:center;
  backdrop-filter:blur(26px) saturate(165%); -webkit-backdrop-filter:blur(26px) saturate(165%);
  display:flex; align-items:center; gap:8px;
}
.toast::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex-shrink:0; transition:background .2s;}
.toast-success::before{background:var(--green);}
.toast-error::before{background:var(--red);}
.toast.show{opacity:1; animation:toastIn .5s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes toastIn{
  0%{transform:translateX(-50%) translateY(10px) scale(.9);}
  55%{transform:translateX(-50%) translateY(-8px) scale(1.04);}
  100%{transform:translateX(-50%) translateY(-4px) scale(1);}
}

.tabbar-wrap{
  position:fixed; left:0; right:0; z-index:30;
  bottom:calc(var(--nav-margin) + env(safe-area-inset-bottom));
  display:flex; justify-content:center; align-items:center; gap:10px; padding:0 var(--nav-margin);
  pointer-events:none;
}
nav.tabbar{
  position:relative; height:var(--nav-h); flex:0 1 293px; max-width:293px; min-width:0;
  display:flex; align-items:stretch; padding:5px;
  border-radius:999px; overflow:hidden;
  background:var(--glass-bg);
  box-shadow:var(--glass-shadow);
  backdrop-filter:blur(28px) saturate(170%); -webkit-backdrop-filter:blur(28px) saturate(170%);
  pointer-events:auto; touch-action:none;
}
.stats-bubble{
  position:relative; width:var(--nav-h); height:var(--nav-h); flex-shrink:0; border-radius:50%;
  background:var(--glass-bg); box-shadow:var(--glass-shadow);
  backdrop-filter:blur(28px) saturate(170%); -webkit-backdrop-filter:blur(28px) saturate(170%);
  display:flex; align-items:center; justify-content:center; color:var(--nav-fg); cursor:pointer;
  pointer-events:auto; transition:color .25s ease, background .25s ease, transform .15s ease;
  box-sizing:border-box;
}
.stats-bubble:active{transform:scale(.92);}
.stats-bubble svg{width:19px; height:19px; opacity:.5; transition:opacity .25s ease;}
.stats-bubble.active{
  color:#fff;
  background:var(--blue);
}
.stats-bubble.active svg{opacity:1;}
.stats-bubble.bump{animation:bubbleBump .32s cubic-bezier(.3,1.2,.4,1);}
@keyframes bubbleBump{
  0%{transform:scale(1);}
  50%{transform:scale(1.06);}
  100%{transform:scale(1);}
}
.tab-pill{
  position:absolute; top:5px; bottom:5px; left:5px;
  width:96px; border-radius:999px;
  background:rgba(0,134,255,.72);
  box-shadow:0 2px 10px rgba(0,134,255,.35), inset 0 1px 0 rgba(255,255,255,.35);
  backdrop-filter:blur(6px) saturate(180%); -webkit-backdrop-filter:blur(6px) saturate(180%);
  transition:left .4s cubic-bezier(.34,1.26,.64,1), width .4s cubic-bezier(.34,1.26,.64,1), opacity .2s ease;
  z-index:0;
}
.tab-pill.dragging{transition:none;}
nav.tabbar .tab{
  position:relative; z-index:1; min-width:0;
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--nav-fg); opacity:.5; font-family:'Space Grotesk',sans-serif; font-size:9.5px; font-weight:700; cursor:pointer;
  transition:color .25s ease, opacity .25s ease, transform .15s ease; padding:0 2px;
}
nav.tabbar .tab:active{transform:scale(.93);}
nav.tabbar .tab span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
nav.tabbar .tab svg{width:20px; height:20px; transition:transform .25s ease;}
nav.tabbar .tab.active{color:#fff; opacity:1;}
nav.tabbar .tab.active svg{transform:translateY(-1px);}

.onboard-wrap{
  position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto;
  display:flex; align-items:flex-start; justify-content:center;
}
.onboard-inner{max-width:520px; width:100%; padding:40px 20px 60px;}
.onboard-hero{text-align:center; margin-bottom:26px;}
.onboard-hero .hero-logo{width:150px; margin:0 auto 10px; color:var(--text);}

.empty-state{text-align:center; padding:30px 10px; color:var(--text-dim);}
.empty-state .big{font-size:34px; margin-bottom:8px;}

/* Boutons d'action rapide sur l'accueil */
.fab-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0 20px;}
.fab-item{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; color:var(--text); min-width:0;}
.fab{
  width:52px; height:52px; border-radius:50%;
  background:var(--blue);
  border:2px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .12s, box-shadow .12s;
}
:root[data-theme="dark"] .fab{border-color:var(--text); box-shadow:4px 4px 0 var(--text);}
.fab-item:active .fab{transform:translate(3px,3px); box-shadow:0 0 0 var(--ink);}
:root[data-theme="dark"] .fab-item:active .fab{box-shadow:0 0 0 var(--text);}
.fab svg{width:21px; height:21px; color:#fff;}
.fab-item span{font-size:9.5px; font-weight:700; color:var(--text-dim); text-align:center; line-height:1.2;}

/* Statistiques */
.stat-note{font-size:12px; color:var(--text-dim); margin-top:10px; font-family:'IBM Plex Mono',monospace;}
.week-chart{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.week-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:34px;}
.week-bars{display:flex; align-items:flex-end; gap:3px; height:58px;}
.week-bar{width:9px; border-radius:3px 3px 1px 1px;}
.week-bar.gym{background:var(--accent);}
.week-bar.run{background:var(--accent-2);}
.week-col span{font-size:9px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;}
.legend{display:flex; gap:16px; margin-top:12px;}
.legend span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); font-weight:600;}
.legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.legend .dot.gym{background:var(--accent);}
.legend .dot.run{background:var(--accent-2);}
.sparkline{width:100%; height:64px; display:block; margin-top:6px; overflow:visible;}
.spark-path{stroke-dasharray:1; stroke-dashoffset:1; animation:sparkDraw 1.2s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes sparkDraw{to{stroke-dashoffset:0;}}
.sparkline.spark-accent .spark-path{stroke:var(--accent);}
.sparkline.spark-accent2 .spark-path{stroke:var(--accent-2);}

::-webkit-scrollbar{display:none;}
</style>

function load(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  profile: load(K.profile, null),
  gym: load(K.gym, []),
  runs: load(K.runs, []),
  progress: load(K.progress, {}),
  programsList: load(K.programsList, []),
  customMachines: load(K.customMachines, []),
  hiddenMachines: load(K.hiddenMachines, []),
  settings: load(K.settings, {theme:"auto"}),
  screen: "home",
};
function allMachinesRaw(){ return [...MACHINES, ...state.customMachines]; }
function allMachines(){ return allMachinesRaw().filter(m=>!state.hiddenMachines.includes(m.id)); }
function slugify(str){
  return str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || uid();
}

/* ============ UTIL ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("fr-FR", {day:"2-digit", month:"short", year:"numeric"});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function startOfWeek(){
  const d = new Date();
  const day = (d.getDay()+6)%7; // Monday=0
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-day);
  return d;
}
function computeTonnage(){
  let total = 0;
  state.gym.forEach(s=>{
    if((s.status||"done")!=="done") return;
    Object.values(s.exercises).forEach(e=>{
      const poids = parseFloat(e.poids)||0, reps = parseFloat(e.reps)||0, series = parseFloat(e.series)||0;
      total += poids * reps * series;
    });
  });
  return total;
}
function mostUsedMachine(){
  const counts = {};
  state.gym.forEach(s=>{
    if((s.status||"done")!=="done") return;
    Object.keys(s.exercises).forEach(id=>{ counts[id] = (counts[id]||0) + 1; });
  });
  let best = null, bestCount = 0;
  Object.entries(counts).forEach(([id,c])=>{ if(c>bestCount){ best=id; bestCount=c; } });
  if(!best) return null;
  const m = allMachinesRaw().find(m=>m.id===best);
  return {label: m ? m.label : best, count: bestCount};
}
function computeStreakWeeks(){
  let streak = 0;
  let cursor = startOfWeek();
  while(true){
    const weekStart = new Date(cursor);
    const weekEnd = new Date(cursor);
    weekEnd.setDate(weekEnd.getDate()+7);
    const hasGym = state.gym.some(s=>(s.status||"done")==="done" && new Date(s.date+"T00:00:00")>=weekStart && new Date(s.date+"T00:00:00")<weekEnd);
    const hasRun = state.runs.some(r=> new Date(r.date+"T00:00:00")>=weekStart && new Date(r.date+"T00:00:00")<weekEnd);
    if(hasGym || hasRun){
      streak++;
      cursor.setDate(cursor.getDate()-7);
    } else break;
  }
  return streak;
}
function showToast(msg, type="default", ms=3200){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type!=="default" ? " toast-"+type : "");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), ms);
}

/* ============ RECORDS ============ */
function machinePR(machineId){
  let max = 0;
  state.gym.forEach(s=>{
    if((s.status||"done")==="draft") return;
    const e = s.exercises[machineId];
    if(e && e.poids && parseFloat(e.poids) > max) max = parseFloat(e.poids);
  });
  return max;
}
function filterRunsBySport(mode){
  return state.runs.filter(r=> (r.sport||"pied")===mode);
}
function computeRunStats(list){
  if(list.length===0) return {bestPace:null, bestSpeed:null, longest:0, totalKm:0};
  let bestPace = Infinity, bestSpeed = 0, longest = 0, totalKm = 0;
  list.forEach(r=>{
    const dist = parseFloat(r.distance)||0;
    const dur = parseFloat(r.duree)||0;
    totalKm += dist;
    if(dist > longest) longest = dist;
    if(dist>0 && dur>0){
      const pace = dur/dist;
      if(pace < bestPace) bestPace = pace;
      const speed = dist/(dur/60);
      if(speed > bestSpeed) bestSpeed = speed;
    }
  });
  return {bestPace: bestPace===Infinity?null:bestPace, bestSpeed: bestSpeed||null, longest, totalKm};
}
function runStats(){
  return computeRunStats(state.runs);
}
function paceStr(paceMinPerKm){
  if(paceMinPerKm==null) return "—";
  const m = Math.floor(paceMinPerKm);
  const s = Math.round((paceMinPerKm - m)*60);
  return `${m}'${s.toString().padStart(2,"0")}"/km`;
}
function speedStr(kmh){
  if(kmh==null) return "—";
  return kmh.toFixed(1) + " km/h";
}
const MONTH_NAMES = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function monthSummary(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const gymCount = state.gym.filter(s=>{
    if((s.status||"done")!=="done") return false;
    const d = new Date(s.date+"T00:00:00");
    return d.getFullYear()===y && d.getMonth()===m;
  }).length;
  const kmMonth = state.runs.filter(r=>{
    const d = new Date(r.date+"T00:00:00");
    return d.getFullYear()===y && d.getMonth()===m;
  }).reduce((a,r)=>a+(parseFloat(r.distance)||0),0);
  return {gymCount, kmMonth, label: MONTH_NAMES[m]};
}

function enableNavDrag(){
  const nav = document.querySelector("nav.tabbar");
  const pill = document.getElementById("tabPill");
  const DRAG_THRESHOLD = 8;
  let pointerId = null, startX = 0, startY = 0, dragEngaged = false;

  function tabsList(){ return [...nav.querySelectorAll(".tab")]; }
  function tabAt(clientX){
    let closest = null, closestDist = Infinity;
    tabsList().forEach(t=>{
      const r = t.getBoundingClientRect();
      const center = r.left + r.width/2;
      const d = Math.abs(clientX - center);
      if(d < closestDist){ closestDist = d; closest = t; }
    });
    return closest;
  }
  function movePillTo(t){
    if(!t) return;
    pill.style.left = t.offsetLeft + "px";
    pill.style.width = t.offsetWidth + "px";
  }
  nav.addEventListener("pointerdown", (e)=>{
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    dragEngaged = false;
    try{ nav.setPointerCapture(e.pointerId); }catch(err){}
  });
  nav.addEventListener("pointermove", (e)=>{
    if(pointerId===null || e.pointerId!==pointerId) return;
    if(!dragEngaged){
      const dist = Math.hypot(e.clientX-startX, e.clientY-startY);
      if(dist > DRAG_THRESHOLD){
        dragEngaged = true;
        pill.classList.add("dragging");
      }
    }
    if(dragEngaged) movePillTo(tabAt(e.clientX));
  });
  function endDrag(e){
    if(pointerId===null || e.pointerId!==pointerId) return;
    pointerId = null;
    const wasEngaged = dragEngaged;
    dragEngaged = false;
    pill.classList.remove("dragging");
    const t = tabAt(e.clientX);
    if(t && t.dataset.screen !== state.screen){
      state.screen = t.dataset.screen;
      window.scrollTo(0,0);
      render();
      lastPointerNavAt = Date.now();
    } else if(wasEngaged){
      positionTabPill();
    }
  }
  nav.addEventListener("pointerup", endDrag);
  nav.addEventListener("pointercancel", endDrag);
  let lastPointerNavAt = 0;
  nav.addEventListener("click", (e)=>{
    if(Date.now() - lastPointerNavAt < 400) return;
    const t = e.target.closest(".tab");
    if(t && t.dataset.screen !== state.screen){
      state.screen = t.dataset.screen;
      window.scrollTo(0,0);
      render();
    }
  });
}
const introPlayedScreens = new Set();
function render(){
  const app = document.getElementById("app");
  if(!state.profile || !state.profile.onboarded){
    state.profile = {name:"", casier:"", onboarded:true};
    save(K.profile, state.profile);
  }
  ensureShell();
  const pagehead = document.getElementById("pagehead");
  const isFirstVisit = !introPlayedScreens.has(state.screen);
  if(state.screen === "home"){
    pagehead.style.display = "none";
  } else {
    pagehead.style.display = "";
    const pageheadText = document.getElementById("pageheadText");
    if(isFirstVisit){
      pageheadText.innerHTML = renderTitleLetters(screenTitle());
    } else {
      pageheadText.textContent = screenTitle();
    }
  }
  document.getElementById("mainContent").innerHTML = renderScreen();
  bindScreen();
  if(lastRenderedScreen !== state.screen){
    if(isFirstVisit){
      staggerEntrance();
      introPlayedScreens.add(state.screen);
    }
    document.querySelectorAll("nav.tabbar .tab").forEach(b=>{
      b.classList.toggle("active", b.dataset.screen === state.screen);
    });
    const bubble = document.querySelector(".stats-bubble");
    bubble.classList.toggle("active", state.screen === "stats");
    if(statsBump){
      bubble.classList.add("bump");
      statsBump = false;
      setTimeout(()=>{ bubble.classList.remove("bump"); }, 400);
    }
    positionTabPill();
    lastRenderedScreen = state.screen;
  }
}
function renderTitleLetters(text){
  return text.split("").map(ch=>{
    const delay = Math.round(Math.random()*170);
    const rise = Math.round(10 + Math.random()*10);
    const content = ch===" " ? "&nbsp;" : ch;
    return `<span class="title-letter" style="animation-delay:${delay}ms; --rise:${rise}px;">${content}</span>`;
  }).join("");
}
function screenTitle(){
  return {gym:"Salle", run:"Course", stats:"Statistiques", programs:"Programmes", settings:"Réglages"}[state.screen] || "SPORT";
}
function staggerEntrance(){
  const kids = document.querySelectorAll("#mainContent > *");
  kids.forEach((el, i)=>{
    el.classList.remove("enter-block");
    el.style.animationDelay = (i * 45) + "ms";
    void el.offsetWidth;
    el.classList.add("enter-block");
  });
}
function tab(id, icon, label){
  return `<button class="tab" data-screen="${id}">${icon}<span>${label}</span></button>`;
}
function positionTabPill(){
  const nav = document.querySelector("nav.tabbar");
  const pill = document.getElementById("tabPill");
  if(!nav || !pill) return;
  const active = nav.querySelector(".tab.active");
  if(!active){ pill.style.opacity = "0"; return; }
  pill.style.opacity = "1";
  pill.style.left = active.offsetLeft + "px";
  pill.style.width = active.offsetWidth + "px";
}
window.addEventListener("resize", positionTabPill);

function renderScreen(){
  if(state.screen==="home") return renderHome();
  if(state.screen==="gym") return renderGym();
  if(state.screen==="run") return renderRun();
  if(state.screen==="stats") return renderStats();
  if(state.screen==="programs") return renderPrograms();
  if(state.screen==="settings") return renderSettings();
  return "";
}
function bindScreen(){
  if(state.screen==="home") bindHome();
  if(state.screen==="gym") bindGym();
  if(state.screen==="run") bindRun();
  if(state.screen==="stats") bindStats();
  if(state.screen==="programs") bindPrograms();
  if(state.screen==="settings") bindSettings();
}

        <div class="stat"><b>${rs.longest.toFixed(1)} km</b><span>plus longue sortie</span></div>
        <div class="stat"><b>${rs.totalKm.toFixed(1)} km</b><span>cumul total</span></div>
      </div>

    <div class="card">
      <h2>Activité récente</h2>
      ${items.length===0 ? emptyState("🏋️","Aucune activité pour l'instant") : items.map(it=>{
        if(it.type==="gym"){
          const nb = Object.values(it.data.exercises).filter(e=>e.poids).length;
          const isDraft = (it.data.status||"done")==="draft";
          return activityRow("gym",ICONS.dumbbell, `Séance salle${isDraft?' · brouillon':''}`, `${fmtDate(it.date)} · ${nb} machine${nb>1?'s':''}`);
        }else{
          return activityRow("run",ICONS.run, `Course — ${it.data.distance} km`, `${fmtDate(it.date)} · ${it.data.duree} min`);
        }
      }).join("")}
    </div>
  `;
}
function emptyState(emoji, text){
  return `<div class="empty-state"><div class="big">${emoji}</div><div>${text}</div></div>`;
}
function activityRow(cls, emoji, title, sub){
  return `<div class="activity-item"><div class="activity-dot ${cls}">${emoji}</div><div class="activity-main"><div class="activity-title">${title}</div><div class="activity-sub">${sub}</div></div></div>`;
}
function bindHome(){
  document.getElementById("openSettings").addEventListener("click", ()=>{ state.screen="settings"; render(); });
  document.getElementById("resumeDraft")?.addEventListener("click", ()=>{
    state.screen="gym";
    render();
  });
  document.getElementById("finishDraftHome")?.addEventListener("click", ()=>{
    const d = getDraftSession();
    if(d && Object.keys(d.exercises).length===0){
      showToast("Renseigne au moins une machine", "error");
      state.screen="gym";
      render();
      return;
    }
    if(d) d.status = "done";
    save(K.gym, state.gym);
    showToast("Séance terminée 💪", "success");
    render();
  });
  document.getElementById("resumeProgramHome")?.addEventListener("click", ()=>{
    state.screen="programs";
    render();
  });
  document.getElementById("finishProgramHome")?.addEventListener("click", ()=>{
    const ap = getActiveProgram();
    if(!ap) return;
    const prog = state.progress[ap.id];
    prog.sessions += 1;
    prog.history = prog.history || [];
    prog.history.push(todayStr());
    prog.done = [];
    prog.active = false;
    save(K.progress, state.progress);
    showToast("Programme terminé, bravo ! 🎉", "success");
    render();
  });
  document.getElementById("quickGym").addEventListener("click", ()=>{
    if(getDraftSession()){
      state.screen="gym";
      render();
      return;
    }
    if(startNewSession()){
      state.screen="gym";
    }
    render();
  });
  document.getElementById("quickRun").addEventListener("click", ()=>{
    state.screen="run";
    runViewMode = "pied";
    runFormOpen = true;
    render();
  });
  document.getElementById("quickVelo").addEventListener("click", ()=>{
    state.screen="run";
    runViewMode = "velo";
    runFormOpen = true;
    render();
  });
  document.getElementById("quickProgram").addEventListener("click", ()=>{
    state.screen="programs";
    render();
  });
}

/* ============ GYM ============ */
let editingSessionId = null;
function getEditingSession(){
  return state.gym.find(s=>s.id===editingSessionId);
}
function getDraftSession(){
  return state.gym.find(s=>(s.status||"done")==="draft");
}
function getActiveProgram(){
  return state.programsList.find(p => state.progress[p.id] && state.progress[p.id].active);
}
function canStartGym(){
  const ap = getActiveProgram();
  if(ap){
    showToast(`Termine ou annule le programme "${ap.title}" avant de commencer une séance salle`, "error");
    return false;
  }
  return true;
}
function canStartProgram(excludeId){
  const draft = getDraftSession();
  if(draft){
    showToast("Termine ou annule ta séance salle avant de démarrer un programme", "error");
    return false;
  }
  const ap = getActiveProgram();
  if(ap && ap.id !== excludeId){
    showToast(`Le programme "${ap.title}" est déjà en cours`, "error");
    return false;
  }
  return true;
}
let justActivatedKey = null;
function startNewSession(){
  if(!canStartGym()) return false;
  const s = {id:uid(), date:todayStr(), exercises:{}, status:"draft"};
  state.gym.push(s);
  save(K.gym, state.gym);
  editingSessionId = s.id;
  justActivatedKey = "gym";
  return true;
}
function closeSessionForm(discardIfEmpty){
  if(discardIfEmpty){
    const s = getEditingSession();
    if(s && (s.status||"done")==="draft" && Object.keys(s.exercises).length===0){
      state.gym = state.gym.filter(x=>x.id!==s.id);
      save(K.gym, state.gym);
    }
  }
  editingSessionId = null;
}
function renderGym(){
  const draft = getDraftSession();
  const displaySession = editingSessionId ? getEditingSession() : draft;
  if(displaySession) editingSessionId = displaySession.id;

  const sorted = [...state.gym].filter(s=>!displaySession || s.id!==displaySession.id).sort((a,b)=>b.date.localeCompare(a.date));
  const machines = allMachines();
  return `
    ${displaySession ? renderGymForm() : `<button class="btn btn-primary" id="toggleGymForm" style="margin-bottom:14px;">+ Nouvelle séance</button>`}

    <div class="card">
      <h2>N° de casier</h2>
      <div class="field" style="margin-bottom:0;">
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="lockerInput" value="${state.profile.casier || ''}" placeholder="Ex : 128">
      </div>
    </div>

    <div class="card">
      <h2>Records par machine</h2>
      ${machines.length===0 ? emptyState("🏋️","Aucune machine active") : `
      <div class="grid-machines">
        ${machines.map(m=>{
          const pr = machinePR(m.id);
          return `<div class="machine-pr"><span class="name">${m.label}</span><span class="val">${pr>0?pr+" kg":"—"}</span></div>`;
        }).join("")}
      </div>`}
    </div>

    <div class="card">
      <h2>Historique</h2>
      ${sorted.length===0 ? emptyState("📋","Aucune séance enregistrée") : sorted.map(s=>{
        const ex = allMachinesRaw().filter(m=>s.exercises[m.id] && s.exercises[m.id].poids)
          .map(m=>`${m.label} ${s.exercises[m.id].poids}kg×${s.exercises[m.id].reps||'?'}(${s.exercises[m.id].series||'?'}s)`).join(" · ");
        return `<div class="history-item" data-edit="${s.id}">
          <div class="history-main">
            <div class="history-date">${fmtDate(s.date)}</div>
            <div class="history-detail">${ex || 'Aucun détail'}</div>
          </div>
          <div class="history-actions">
            <button class="del-btn" data-id="${s.id}" title="Supprimer">${ICONS.trash}</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}
function renderGymForm(){
  const session = getEditingSession();
  if(!session) return "";
  const machines = allMachines();
  const isDraft = (session.status||"done")==="draft";
  let reveal = "";
  if(isDraft && justActivatedKey === "gym"){ reveal = " reveal-in"; justActivatedKey = null; }
  return `
  <div class="card ${isDraft?'card-live':''}${reveal}">
    <h2>${isDraft? '<span class="live-dot"></span>Séance en cours' : "Modifier la séance"}</h2>
    <div class="field">
      <label class="field-label">Date</label>
      <input type="date" id="gymDate" value="${session.date}">
    </div>
    ${machines.length===0 ? emptyState("🏋️","Ajoute une machine ci-dessous") : `
    <div class="ex-head"><span>Machine</span><span>Kg</span><span>Reps</span><span>Séries</span><span></span></div>
    ${machines.map(m=>{
      const val = session.exercises[m.id] || {};
      return `
      <div class="exercise-row">
        <div class="ex-name">${m.label}</div>
        <input type="number" step="0.5" min="0" inputmode="decimal" data-machine="${m.id}" data-field="poids" value="${val.poids||''}" placeholder="—">
        <input type="number" min="0" inputmode="numeric" data-machine="${m.id}" data-field="reps" value="${val.reps||''}" placeholder="—">
        <input type="number" min="0" inputmode="numeric" data-machine="${m.id}" data-field="series" value="${val.series||''}" placeholder="—">
        <button type="button" class="ex-remove" data-remove-machine="${m.id}" title="Retirer cette machine">✕</button>
      </div>`;
    }).join("")}`}
    <div class="add-machine-row">
      <input type="text" id="newMachineName" placeholder="Nouvelle machine (ex : Leg press)">
      <button class="btn btn-ghost" id="addMachineBtn" type="button">+ Ajouter</button>
    </div>
    ${isDraft ? `
    <div class="btn-row-3070" style="margin-top:8px;">
      <button class="btn btn-cancel" id="discardGym">Annuler</button>
      <button class="btn btn-primary" id="finishGym">Terminer ✓</button>
    </div>` : `
    <button class="btn btn-primary" id="closeEditGym" style="margin-top:8px;">Fermer</button>
    `}
  </div>`;
}
function bindGym(){
  document.getElementById("toggleGymForm")?.addEventListener("click", ()=>{
    startNewSession();
    render();
  });
  if(editingSessionId){
    document.getElementById("gymDate").addEventListener("change", e=>{
      const s = getEditingSession();
      if(s){ s.date = e.target.value || todayStr(); save(K.gym, state.gym); }
    });
    document.querySelectorAll("[data-machine]").forEach(inp=>{
      inp.addEventListener("input", e=>{
        const s = getEditingSession();
        if(!s) return;
        const machineId = inp.dataset.machine, field = inp.dataset.field;
        if(!s.exercises[machineId]) s.exercises[machineId] = {};
        s.exercises[machineId][field] = e.target.value;
        save(K.gym, state.gym);
      });
    });
    document.getElementById("addMachineBtn").addEventListener("click", ()=>{
      const input = document.getElementById("newMachineName");
      const label = input.value.trim();
      if(!label){ showToast("Donne un nom à la machine", "error"); return; }
      const id = "custom_" + slugify(label) + "_" + Date.now().toString(36).slice(-4);
      state.customMachines.push({id, label});
      save(K.customMachines, state.customMachines);
      showToast(`"${label}" ajoutée`, "success");
      render();
    });
    document.querySelectorAll("[data-remove-machine]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.removeMachine;
        const isCustom = id.startsWith("custom_");
        if(isCustom){
          state.customMachines = state.customMachines.filter(m=>m.id!==id);
          save(K.customMachines, state.customMachines);
        } else {
          if(!state.hiddenMachines.includes(id)) state.hiddenMachines.push(id);
          save(K.hiddenMachines, state.hiddenMachines);
        }
        render();
      });
    });
    document.getElementById("discardGym")?.addEventListener("click", ()=>{
      closeSessionForm(true);
      showToast("Séance annulée");
      render();
    });
    document.getElementById("finishGym")?.addEventListener("click", ()=>{
      const s = getEditingSession();
      if(s && Object.keys(s.exercises).length===0){
        showToast("Renseigne au moins une machine", "error");
        return;
      }
      if(s) s.status = "done";
      save(K.gym, state.gym);
      closeSessionForm(false);
      showToast("Séance terminée 💪", "success");
      render();
    });
    document.getElementById("closeEditGym")?.addEventListener("click", ()=>{
      closeSessionForm(false);
      render();
    });
  }
  const locker = document.getElementById("lockerInput");
  if(locker){
    locker.addEventListener("change", (e)=>{
      state.profile.casier = e.target.value.trim();
      save(K.profile, state.profile);
      showToast("Numéro de casier enregistré", "success");
    });
  }
  document.querySelectorAll("[data-edit]").forEach(b=>{
    b.addEventListener("click", ()=>{
      editingSessionId = b.dataset.edit;
      render();
    });
  });
  document.querySelectorAll(".del-btn[data-id]").forEach(b=>{
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      state.gym = state.gym.filter(s=>s.id !== b.dataset.id);
      save(K.gym, state.gym);
      render();
    });
  });
}

/* ============ RUN ============ */
let runFormOpen = false;
let runViewMode = "pied";
let editingRunId = null;
function renderRun(){
  const list = filterRunsBySport(runViewMode);
  const sorted = [...list].sort((a,b)=>b.date.localeCompare(a.date));
  const rs = computeRunStats(list);
  const isVelo = runViewMode === "velo";
  return `
    <div class="choice-group" id="runViewSwitch" style="margin-bottom:14px;">
      <div class="choice ${!isVelo?'active':''}" data-mode="pied">🏃 À pied</div>
      <div class="choice ${isVelo?'active':''}" data-mode="velo">🚴 À vélo</div>
    </div>
    ${!runFormOpen ? `<button class="btn btn-primary" id="toggleRunForm" style="margin-bottom:14px;">${isVelo?"+ Nouvelle sortie vélo":"+ Nouvelle course"}</button>` : ""}
    ${runFormOpen ? renderRunForm() : ""}
    <div class="card">
      <h2>Records</h2>
      <div class="row-stats">
        <div class="stat"><b>${isVelo? speedStr(rs.bestSpeed) : paceStr(rs.bestPace)}</b><span>${isVelo?"vitesse max":"meilleure allure"}</span></div>
        <div class="stat"><b>${rs.longest.toFixed(1)} km</b><span>plus longue sortie</span></div>
        <div class="stat"><b>${rs.totalKm.toFixed(1)} km</b><span>cumul total</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Historique</h2>
      ${sorted.length===0 ? emptyState(isVelo?"🚴":"🏃", isVelo?"Aucune sortie vélo enregistrée":"Aucune course enregistrée") : sorted.map(r=>{
        const dist = parseFloat(r.distance), dur = parseFloat(r.duree);
        const perf = isVelo ? speedStr(dist/(dur/60)) : paceStr(dur/dist);
        const extra = [];
        if(r.fc) extra.push(`${r.fc} bpm`);
        if(r.denivele) extra.push(`D+ ${r.denivele} m`);
        if(r.calories) extra.push(`${r.calories} kcal`);
        if(r.type) extra.push(RUN_TYPES.find(t=>t.id===r.type)?.label || r.type);
        return `<div class="history-item" data-editrun="${r.id}">
          <div class="history-main"><div class="history-date">${fmtDate(r.date)}</div><div class="history-detail">${r.distance} km · ${r.duree} min · ${perf}${extra.length? " · "+extra.join(" · "):""}</div></div>
          <div class="history-actions"><button class="del-btn" data-id="${r.id}" title="Supprimer">${ICONS.trash}</button></div>
        </div>`;
      }).join("")}
    </div>
  `;
}
function renderRunForm(){
  const editing = editingRunId ? state.runs.find(r=>r.id===editingRunId) : null;
  const isVelo = editing ? editing.sport==="velo" : runViewMode === "velo";
  return `
  <div class="card reveal-in">
    <h2>${editing ? "Modifier" : (isVelo?"Nouvelle sortie vélo":"Nouvelle course")}</h2>
    <div class="field"><label class="field-label">Type</label><div class="choice-group" id="runSport">
      <div class="choice ${!isVelo?'active':''}" data-val="pied">🏃 À pied</div>
      <div class="choice ${isVelo?'active':''}" data-val="velo">🚴 À vélo</div>
    </div></div>
    <div class="field"><label class="field-label">Date</label><input type="date" id="runDate" value="${editing?editing.date:todayStr()}"></div>
    <div class="field"><label class="field-label">Distance (km)</label><input type="number" step="0.01" min="0" id="runDist" value="${editing?editing.distance:''}" placeholder="Ex : 5.2"></div>
    <div class="field"><label class="field-label">Durée (minutes)</label><input type="number" step="0.1" min="0" id="runDur" value="${editing?editing.duree:''}" placeholder="Ex : 28.5"></div>
    <div class="field" id="runPacePreview" style="font-size:13px; color:var(--text-dim);"></div>
    <div class="field"><label class="field-label">Type de sortie</label><div class="choice-group" id="runType">
      ${RUN_TYPES.map((t)=>`<div class="choice ${(editing? editing.type===t.id : t.id===RUN_TYPES[0].id)?'active':''}" data-val="${t.id}">${t.label}</div>`).join("")}
    </div></div>
    <div class="field"><label class="field-label">FC moyenne (bpm, optionnel)</label><input type="number" min="0" id="runFc" value="${editing?(editing.fc||''):''}" placeholder="Ex : 152"></div>
    <div class="field"><label class="field-label">Dénivelé positif (m, optionnel)</label><input type="number" min="0" id="runDenivele" value="${editing?(editing.denivele||''):''}" placeholder="Ex : 80"></div>
    <div class="field"><label class="field-label">Calories (kcal, optionnel)</label><input type="number" min="0" id="runCalories" value="${editing?(editing.calories||''):''}" placeholder="Ex : 320"></div>
    <div class="btn-row-3070">
      <button class="btn btn-cancel" id="cancelRunForm">Annuler</button>
      <button class="btn btn-primary" id="saveRun">Enregistrer</button>
    </div>
  </div>`;
}
function bindRun(){
  document.querySelectorAll("#runViewSwitch .choice").forEach(c=>{
    c.addEventListener("click", ()=>{
      runViewMode = c.dataset.mode;
      runFormOpen = false;
      editingRunId = null;
      render();
    });
  });
  document.getElementById("toggleRunForm")?.addEventListener("click", ()=>{
    runFormOpen = true;
    editingRunId = null;
    render();
  });
  if(runFormOpen){
    document.getElementById("cancelRunForm").addEventListener("click", ()=>{
      runFormOpen = false;
      editingRunId = null;
      render();
    });
    const dist = document.getElementById("runDist");
    const dur = document.getElementById("runDur");
    const preview = document.getElementById("runPacePreview");
    const editing = editingRunId ? state.runs.find(r=>r.id===editingRunId) : null;
    let runTypeVal = editing ? editing.type : RUN_TYPES[0].id;
    let runSportVal = editing ? editing.sport : runViewMode;
    document.querySelectorAll("#runSport .choice").forEach(c=>{
      c.addEventListener("click", ()=>{
        document.querySelectorAll("#runSport .choice").forEach(x=>x.classList.remove("active"));
        c.classList.add("active");
        runSportVal = c.dataset.val;
        updatePreview();
      });
    });
    document.querySelectorAll("#runType .choice").forEach(c=>{
      c.addEventListener("click", ()=>{
        document.querySelectorAll("#runType .choice").forEach(x=>x.classList.remove("active"));
        c.classList.add("active");
        runTypeVal = c.dataset.val;
      });
    });
    function updatePreview(){
      const d = parseFloat(dist.value), t = parseFloat(dur.value);
      if(d>0 && t>0){
        preview.textContent = runSportVal==="velo"
          ? "Vitesse estimée : " + speedStr(d/(t/60))
          : "Allure estimée : " + paceStr(t/d);
      } else { preview.textContent = ""; }
    }
    updatePreview();
    dist.addEventListener("input", updatePreview);
    dur.addEventListener("input", updatePreview);
    document.getElementById("saveRun").addEventListener("click", ()=>{
      const date = document.getElementById("runDate").value || todayStr();
      const distance = dist.value, duree = dur.value;
      if(!distance || !duree){ showToast("Renseigne distance et durée", "error"); return; }
      const fc = document.getElementById("runFc").value;
      const denivele = document.getElementById("runDenivele").value;
      const calories = document.getElementById("runCalories").value;
      if(editing){
        Object.assign(editing, {date, distance, duree, sport:runSportVal, type:runTypeVal, fc, denivele, calories});
        showToast("Modifications enregistrées", "success");
      } else {
        state.runs.push({id:uid(), date, distance, duree, sport:runSportVal, type:runTypeVal, fc, denivele, calories});
        showToast(runSportVal==="velo" ? "Sortie vélo enregistrée 🚴" : "Course enregistrée 🏃", "success");
      }
      save(K.runs, state.runs);
      runFormOpen = false;
      editingRunId = null;
      runViewMode = runSportVal;
      render();
    });
  }
  document.querySelectorAll("[data-editrun]").forEach(item=>{
    item.addEventListener("click", ()=>{
      editingRunId = item.dataset.editrun;
      runFormOpen = true;
      render();
    });
  });
  document.querySelectorAll(".del-btn").forEach(b=>{
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      state.runs = state.runs.filter(r=>r.id !== b.dataset.id);
      save(K.runs, state.runs);
      render();
    });
  });

let statsMachine = null;
function getWeekKey(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = (d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function weeklyVolume(n){
  const weeks = [];
  const now = new Date();
  const day = (now.getDay()+6)%7;
  now.setHours(0,0,0,0); now.setDate(now.getDate()-day);
  for(let i=n-1;i>=0;i--){
    const start = new Date(now); start.setDate(start.getDate()-7*i);
    weeks.push({key:start.toISOString().slice(0,10), start, gym:0, run:0, km:0});
  }
  state.gym.forEach(s=>{ if((s.status||"done")!=="done") return; const k=getWeekKey(s.date); const w=weeks.find(w=>w.key===k); if(w) w.gym++; });
  state.runs.forEach(r=>{ const k=getWeekKey(r.date); const w=weeks.find(w=>w.key===k); if(w){ w.run++; w.km += parseFloat(r.distance)||0; } });
  return weeks;
}
function machineSeries(machineId){
  return state.gym.filter(s=>(s.status||"done")==="done" && s.exercises[machineId] && s.exercises[machineId].poids)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(s=>({date:s.date, poids:parseFloat(s.exercises[machineId].poids)}));
}
function smoothPath(pts){
  if(pts.length===2){
    return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} L${pts[1].x.toFixed(1)},${pts[1].y.toFixed(1)}`;
  }
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} `;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const cp1x = p1.x + (p2.x - p0.x)/6;
    const cp1y = p1.y + (p2.y - p0.y)/6;
    const cp2x = p2.x - (p3.x - p1.x)/6;
    const cp2y = p2.y - (p3.y - p1.y)/6;
    d += `C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} `;
  }
  return d;
}
function sparklineSVG(values, colorClass){
  if(values.length<2) return "";
  const w=300,h=64,pad=6;
  const max=Math.max(...values), min=Math.min(...values);
  const range=(max-min)||1;
  const step=(w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x=pad+i*step;
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return {x,y};
  });
  const d = smoothPath(pts);
  return `<svg viewBox="0 0 ${w} ${h}" class="sparkline ${colorClass}"><path class="spark-path" d="${d}" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>`;
}

      render();
    });
    document.querySelectorAll("[data-pick-machine]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const m = allMachines().find(m=>m.id===el.dataset.pickMachine);
        if(!m) return;
        // remplace la dernière étape si elle est vide, sinon ajoute une nouvelle étape
        const lastIdx = programDraftSteps.length-1;
        if(programDraftSteps[lastIdx].trim()===""){
          programDraftSteps[lastIdx] = m.label;
          programDraftStepMachines[lastIdx] = m.id;
        } else {
          programDraftSteps.push(m.label);
          programDraftStepMachines.push(m.id);
          programDraftStepDetails.push({series:"",reps:"",temps:""});
        }
        programMachinePickerOpen = false;
        render();
      });
    });
    document.getElementById("saveProgram").addEventListener("click", ()=>{
      const title = programDraftTitle.trim();
      const pairs = programDraftSteps
        .map((s,i)=>({
          text:s.trim(),
          machineId: programDraftStepMachines[i]||null,
          detail: programDraftStepDetails[i] || {series:"",reps:"",temps:""},
        }))
        .filter(p=>p.text);
      if(!title){ showToast("Donne un nom au programme", "error"); return; }
      if(pairs.length===0){ showToast("Ajoute au moins une étape", "error"); return; }
      const steps = pairs.map(p=>p.text);
      const stepMachines = pairs.map(p=>p.machineId);
      const stepDetails = pairs.map(p=>(p.detail.series||p.detail.reps||p.detail.temps) ? p.detail : null);
      if(programEditingId){
        const existing = state.programsList.find(p=>p.id===programEditingId);
        if(existing){
          existing.title = title;
          existing.steps = steps;
          existing.stepMachines = stepMachines;
          existing.stepDetails = stepDetails;
        }
        showToast("Programme mis à jour", "success");
      } else {
        state.programsList.push({ id:uid(), title, steps, stepMachines, stepDetails });
        showToast("Programme créé 🎉", "success");
      }
      save(K.programsList, state.programsList);
      programFormOpen = false; programEditingId = null;
      programDraftTitle=""; programDraftSteps=[""]; programDraftStepMachines=[null]; programDraftStepDetails=[{series:"",reps:"",temps:""}]; programMachinePickerOpen=false;
      render();
    });
  }
  document.querySelectorAll("[data-delprog]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(confirm("Supprimer ce programme ? Ses statistiques resteront visibles dans Statistiques.")){
        const pid = btn.dataset.delprog;
        const prog = state.programsList.find(p=>p.id===pid);
        if(prog && state.progress[pid]){
          state.progress[pid].title = prog.title;
        }
        state.programsList = state.programsList.filter(p=>p.id!==pid);
        save(K.programsList, state.programsList);
        save(K.progress, state.progress);
        render();
      }
    });
  });
  document.querySelectorAll("[data-move-up]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.moveUp;
      const i = state.programsList.findIndex(p=>p.id===id);
      if(i>0){
        [state.programsList[i-1], state.programsList[i]] = [state.programsList[i], state.programsList[i-1]];
        save(K.programsList, state.programsList);
        render();
      }
    });
  });
  document.querySelectorAll("[data-move-down]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.moveDown;
      const i = state.programsList.findIndex(p=>p.id===id);
      if(i>-1 && i<state.programsList.length-1){
        [state.programsList[i+1], state.programsList[i]] = [state.programsList[i], state.programsList[i+1]];
        save(K.programsList, state.programsList);
        render();
      }
    });
  });
  document.querySelectorAll(".step-check").forEach(el=>{
    el.addEventListener("click", ()=>{
      const pid = el.dataset.prog, idx = parseInt(el.dataset.idx);
      if(!state.progress[pid]) state.progress[pid] = {done:[], sessions:0};
      const done = state.progress[pid].done;
      const pos = done.indexOf(idx);
      if(pos>-1) done.splice(pos,1); else done.push(idx);
      save(K.progress, state.progress);
      render();
    });
  });
  document.querySelectorAll("[data-finish]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const pid = el.dataset.finish;
      if(!state.progress[pid]) state.progress[pid] = {done:[], sessions:0, history:[]};
      if(!state.progress[pid].history) state.progress[pid].history = [];
      state.progress[pid].sessions += 1;
      state.progress[pid].history.push(todayStr());
      state.progress[pid].done = [];
      state.progress[pid].active = false;
      save(K.progress, state.progress);
      showToast("Programme terminé, bravo ! 🎉", "success");
      render();
    });
  });
  document.querySelectorAll("[data-cancel-active]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const pid = btn.dataset.cancelActive;
      if(state.progress[pid]){
        state.progress[pid].active = false;
        state.progress[pid].done = [];
        save(K.progress, state.progress);
      }
      showToast("Programme annulé");
      render();
    });
  });
  document.querySelectorAll("[data-start-program]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      startProgram(btn.dataset.startProgram);
    });
  });
  document.querySelectorAll("[data-view-program]").forEach(card=>{
    card.addEventListener("click", (e)=>{
      if(e.target.closest("button")) return;
      programViewingId = card.dataset.viewProgram;
      render();
    });
  });
  document.querySelectorAll("[data-close-preview]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      programViewingId = null;
      render();
    });
  });
}
function startProgram(id){
  if(!canStartProgram(id)){ render(); return; }
  if(!state.progress[id]) state.progress[id] = {done:[], sessions:0, history:[]};
  state.progress[id].done = [];
  state.progress[id].active = true;
  save(K.progress, state.progress);
  programViewingId = null;
  justActivatedKey = id;
  showToast("Programme démarré 💪", "success");
  render();
}

/* ============ SETTINGS ============ */
function renderSettings(){
  return `
    <div class="card">
      <h2>Machines</h2>
      ${allMachinesRaw().map(m=>{
        const hidden = state.hiddenMachines.includes(m.id);
        const isCustom = m.id.startsWith("custom_");
        return `<div class="machine-manage-row">
          <span class="mm-name">${m.label}</span>
          <div class="mm-actions">
            <button class="mm-toggle ${hidden?'':'on'}" data-toggle-machine="${m.id}">${hidden ? "Masquée" : "Active"}</button>
            ${isCustom ? `<button class="del-btn" data-delmachine="${m.id}" title="Supprimer définitivement">${ICONS.trash}</button>` : ""}
          </div>
        </div>`;
      }).join("")}
      <div class="add-machine-row" style="margin-top:12px;">
        <input type="text" id="newMachineFromSettings" placeholder="Nouvelle machine (ex : Leg press)">
        <button class="btn btn-ghost" id="addMachineFromSettingsBtn" type="button">+ Ajouter</button>
      </div>
    </div>

    <div class="card">
      <h2>Données</h2>
      <div class="btn-row">
        <button class="btn btn-secondary" id="exportBtn">Exporter</button>
        <button class="btn btn-secondary" id="importBtn">Importer</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn btn-ghost" id="resetBtn">Réinitialiser toutes les données</button>
    </div>

    <div class="card">
      <h2>À propos</h2>
      <div class="settings-row"><span class="lbl">Version</span><span class="val">${APP_VERSION}</span></div>
      <div class="settings-row"><span class="lbl">Poids de l'app</span><span class="val" id="appSizeVal">…</span></div>
      <button class="btn btn-secondary" id="checkUpdateBtn" style="margin-top:10px; gap:8px;"><span class="spin-wrap">${ICONS.refresh}</span>Rechercher une mise à jour</button>
    </div>

    <div class="card">
      <h2>Changelog</h2>
      ${CHANGELOG.map((c,i)=>`
        <details class="changelog-group" ${i===0?'open':''}>
          <summary>v${c.version}</summary>
          <div class="changelog-entry"><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        </details>
      `).join("")}
    </div>
  `;
}
function bindSettings(){
  document.querySelectorAll("[data-toggle-machine]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.toggleMachine;
      const pos = state.hiddenMachines.indexOf(id);
      if(pos>-1) state.hiddenMachines.splice(pos,1); else state.hiddenMachines.push(id);
      save(K.hiddenMachines, state.hiddenMachines);
      render();
    });
  });
  document.querySelectorAll("[data-delmachine]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(confirm("Supprimer définitivement cette machine personnalisée ?")){
        const id = btn.dataset.delmachine;
        state.customMachines = state.customMachines.filter(m=>m.id!==id);
        state.hiddenMachines = state.hiddenMachines.filter(h=>h!==id);
        save(K.customMachines, state.customMachines);
        save(K.hiddenMachines, state.hiddenMachines);
        render();
      }
    });
  });
  document.getElementById("addMachineFromSettingsBtn")?.addEventListener("click", ()=>{
    const input = document.getElementById("newMachineFromSettings");
    const label = input.value.trim();
    if(!label){ showToast("Donne un nom à la machine", "error"); return; }
    const id = "custom_" + slugify(label) + "_" + Date.now().toString(36).slice(-4);
    state.customMachines.push({id, label});
    save(K.customMachines, state.customMachines);
    showToast(`"${label}" ajoutée`, "success");
    render();
  });
  const sizeEl = document.getElementById("appSizeVal");
  if(sizeEl){
    fetch("./index.html", {cache:"no-store"})
      .then(r=> r.ok ? r.blob() : null)
      .then(blob=>{
        if(blob){ sizeEl.textContent = (blob.size/1024).toFixed(0) + " Ko"; }
        else { sizeEl.textContent = (new Blob([document.documentElement.outerHTML]).size/1024).toFixed(0) + " Ko (estimé)"; }
      })
      .catch(()=>{
        sizeEl.textContent = (new Blob([document.documentElement.outerHTML]).size/1024).toFixed(0) + " Ko (estimé)";
      });
  }
  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const data = {profile:state.profile, gym:state.gym, runs:state.runs, progress:state.progress, programsList:state.programsList, customMachines:state.customMachines, exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `sport-export-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Export téléchargé", "success");
  });
  document.getElementById("importBtn").addEventListener("click", ()=>{
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(data.profile) { state.profile = data.profile; save(K.profile, state.profile); }
        if(data.gym) { state.gym = data.gym; save(K.gym, state.gym); }
        if(data.runs) { state.runs = data.runs; save(K.runs, state.runs); }
        if(data.progress) { state.progress = data.progress; save(K.progress, state.progress); }
        if(data.programsList) { state.programsList = data.programsList; save(K.programsList, state.programsList); }
        if(data.customMachines) { state.customMachines = data.customMachines; save(K.customMachines, state.customMachines); }
        showToast("Import réussi", "success");
        render();
      }catch(err){ showToast("Fichier invalide", "error"); }
    };
    reader.readAsText(file);
  });
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Supprimer toutes les données de l'app ? Cette action est irréversible.")){
      localStorage.clear();
      location.reload();
    }
  });
  document.getElementById("checkUpdateBtn").addEventListener("click", ()=>checkForUpdate(true));
}

/* ============ UPDATE CHECK ============ */
function checkForUpdate(manual){
  const btn = document.getElementById("checkUpdateBtn");
  if(btn) btn.classList.add("spinning");
  fetch("./index.html?_=" + Date.now(), {cache:"no-store"})
    .then(r=> r.ok ? r.text() : null)
    .then(text=>{
      if(btn) btn.classList.remove("spinning");
      if(!text){
        if(manual) showToast("Impossible de vérifier (hors ligne ?)", "error");
        return;
      }
      const match = text.match(/APP_VERSION\s*=\s*"([^"]+)"/);
      const remote = match ? match[1] : null;
      if(remote && remote !== APP_VERSION){
        showToast("Nouvelle version disponible, mise à jour…", "success");
        setTimeout(()=>{
          location.href = location.pathname + "?v=" + remote + "&_=" + Date.now();
        }, 700);
      } else if(manual){
        showToast("Tu as déjà la dernière version (" + APP_VERSION + ")");
      }
    })
    .catch(()=>{
      if(btn) btn.classList.remove("spinning");
      if(manual) showToast("Impossible de vérifier (hors ligne ?)", "error");
    });
}

/* ============ BOOT ============ */
render();
checkForUpdate(false);

if ("serviceWorker" in navigator) {
  // pas de service worker dédié : on garde le fetch manuel ci-dessus pour rester simple et fiable
}
</script>
</body>
