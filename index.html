<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sport</title>
<meta name="theme-color" content="#1a1e3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sport">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --radius-s:12px; --radius-m:18px; --radius-l:26px;
  --nav-h:60px;
  --nav-margin:14px;
  /* Palette 100% issue de l'icône Sport (dégradé bleu nuit -> lavande) */
  --navy-deep:#1e2d58;
  --navy-mid:#313e73;
  --lavender:#5c639a;
  --letter:#c7cbea;
  --accent:#3d4fe0;
  --accent-2:#7b81c9;
  --accent-dim:#3d4fe026;
  --accent-dim-2:#3d4fe042;
}
:root[data-theme="dark"]{
  --bg:#0a0e22;
  --text:#eef0fb;
  --text-dim:#9aa0cc;
  --border: rgba(200,204,240,.14);
  --bg-elevated: rgba(255,255,255,.06);
  --bg-card: rgba(255,255,255,.05);
  --bg-input: rgba(255,255,255,.065);
  --shadow-strong: 0 16px 40px rgba(2,4,14,.6);
  --glass-bg: linear-gradient(155deg, rgba(255,255,255,.11), rgba(255,255,255,.02));
  --glass-border: rgba(255,255,255,.16);
  --glass-shadow: 0 12px 34px rgba(2,4,14,.55), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.3);
  --glass-bg-strong: linear-gradient(155deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
  --blob-2: #234085;
  --blob-opacity:.2;
}
:root[data-theme="light"]{
  --bg:#eceefa;
  --text:#1a1e3d;
  --text-dim:#5c6094;
  --border: rgba(30,45,88,.10);
  --bg-elevated: rgba(255,255,255,.65);
  --bg-card: rgba(255,255,255,.5);
  --bg-input: rgba(255,255,255,.55);
  --shadow-strong: 0 16px 38px rgba(30,45,88,.16);
  --glass-bg: linear-gradient(155deg, rgba(255,255,255,.78), rgba(255,255,255,.4));
  --glass-border: rgba(255,255,255,.75);
  --glass-shadow: 0 12px 30px rgba(30,45,88,.14), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(30,45,88,.05);
  --glass-bg-strong: linear-gradient(155deg, rgba(255,255,255,.9), rgba(255,255,255,.55));
  --blob-2: var(--lavender);
  --blob-opacity:.28;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  position:relative;
}
/* Halos de couleur ambiants pour donner du relief au verre */
body::before, body::after{
  content:""; position:fixed; width:66vmax; height:66vmax; border-radius:50%;
  filter:blur(90px); z-index:-1; pointer-events:none;
}
body::before{ background:var(--accent); opacity:var(--blob-opacity); top:-26%; right:-24%; }
body::after{ background:var(--blob-2); opacity:var(--blob-opacity); bottom:-30%; left:-26%; }

#app{
  max-width:560px; margin:0 auto; min-height:100vh; position:relative;
  padding-bottom:calc(var(--nav-h) + var(--nav-margin)*2 + 20px + env(safe-area-inset-bottom));
}
.pagehead{
  padding:18px 18px 4px; padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.pagehead span{
  font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; letter-spacing:.6px;
  text-transform:uppercase; color:var(--text-dim);
}
.home-top{display:flex; justify-content:flex-end; margin-bottom:10px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--glass-border);
  background:var(--glass-bg); color:var(--text); display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:var(--glass-shadow);
  backdrop-filter:blur(16px) saturate(120%); -webkit-backdrop-filter:blur(16px) saturate(120%);
}
.icon-btn svg{width:18px; height:18px;}
.icon-btn.spinning svg{animation:spin .8s linear infinite;}
.spin-wrap{display:inline-flex; width:16px; height:16px;}
.spin-wrap svg{width:16px; height:16px;}
.btn.spinning .spin-wrap svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
main{padding:18px;}
.screen{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* Hero */
.hero{
  border-radius:var(--radius-l);
  background:linear-gradient(135deg, var(--navy-deep), var(--lavender));
  padding:28px 22px; color:var(--letter); position:relative; overflow:hidden;
  box-shadow:var(--shadow-strong), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -18px 30px rgba(0,0,0,.18);
  margin-bottom:18px;
}
.hero::before{
  content:""; position:absolute; top:-40%; right:-20%; width:70%; height:120%;
  background:radial-gradient(circle, rgba(255,255,255,.16), transparent 70%);
  pointer-events:none;
}
.hero-logo{
  width:168px; margin:0 0 8px; color:var(--letter); position:relative;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.35));
}
.hero-logo svg{width:100%; height:auto; display:block; fill:currentColor;}
.hero-sub{font-size:13px; opacity:.85; margin:0; font-weight:600; position:relative;}
.hero-locker{
  margin-top:18px; display:flex; align-items:center; gap:10px; position:relative;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
  border-radius:var(--radius-m); padding:10px 14px;
  backdrop-filter:blur(6px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.hero-locker label{font-size:11px; opacity:.8; text-transform:uppercase; letter-spacing:.6px; display:block;}
.hero-locker input{
  background:transparent; border:none; color:var(--letter); font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;
  width:100%; outline:none;
}

.card{
  background:var(--bg-card); border:1px solid var(--glass-border); border-radius:var(--radius-m);
  padding:16px; margin-bottom:14px; box-shadow:var(--glass-shadow);
  backdrop-filter:blur(18px) saturate(120%); -webkit-backdrop-filter:blur(18px) saturate(120%);
}
.card h2{font-family:'Manrope',sans-serif; font-size:13px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.8px; font-weight:800; color:var(--text-dim);}
.row-stats{display:flex; gap:10px;}
.stat{flex:1; text-align:center; background:var(--bg-input); border-radius:var(--radius-s); padding:12px 6px; border:1px solid var(--border);}
.stat b{display:block; font-size:19px; font-family:'IBM Plex Mono',monospace; font-weight:600;}
.stat span{font-size:11px; color:var(--text-dim);}

.grid-machines{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.machine-pr{
  background:var(--bg-input); border-radius:var(--radius-s); padding:10px 12px; border:1px solid var(--border);
}
.machine-pr .name{font-size:12px; color:var(--text-dim); display:block; margin-bottom:2px;}
.machine-pr .val{font-size:17px; font-weight:600; font-family:'IBM Plex Mono',monospace;}

.activity-item{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);
}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--glass-border);}
.activity-dot svg{width:16px; height:16px;}
.activity-dot.gym{background:var(--accent-dim); color:var(--accent);}
.activity-dot.run{background:rgba(123,129,201,.18); color:var(--accent-2);}
.activity-main{flex:1; min-width:0;}
.activity-title{font-weight:700; font-size:14px;}
.activity-sub{font-size:12px; color:var(--text-dim);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:var(--radius-m); padding:13px 18px; font-family:'Manrope',sans-serif; font-size:15px; font-weight:700;
  cursor:pointer; width:100%; transition:transform .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(155deg, rgba(255,255,255,.22), rgba(255,255,255,0)) , var(--accent);
  color:#fff; box-shadow:0 8px 20px var(--accent-dim-2), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.15);
}
.btn-secondary{
  background:var(--glass-bg); color:var(--text); border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  backdrop-filter:blur(16px) saturate(120%); -webkit-backdrop-filter:blur(16px) saturate(120%);
}
.btn-ghost{background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-dim-2); backdrop-filter:blur(10px);}
.btn-row{display:flex; gap:10px; margin-bottom:14px;}
.btn-row .btn{width:auto; flex:1;}

label.field-label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field{margin-bottom:14px;}
input[type=text], input[type=number], input[type=date], select{
  width:100%; padding:12px 14px; border-radius:var(--radius-s); border:1px solid var(--glass-border);
  background:var(--bg-input); color:var(--text); font-family:'Manrope',sans-serif; font-size:15px; outline:none;
  backdrop-filter:blur(10px);
}
input:focus, select:focus{border-color:var(--accent);}

.choice-group{display:flex; flex-wrap:wrap; gap:8px;}
.choice{
  padding:10px 14px; border-radius:999px; border:1px solid var(--glass-border); background:var(--bg-input);
  color:var(--text-dim); font-family:'Manrope',sans-serif; font-size:13px; font-weight:700; cursor:pointer;
  backdrop-filter:blur(10px);
}
.choice.active{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 14px var(--accent-dim-2);}

.exercise-row{
  display:grid; grid-template-columns:1fr 64px 56px 56px; gap:8px; align-items:center; margin-bottom:10px;
}
.exercise-row .ex-name{font-size:13px; font-weight:600;}
.exercise-row input{padding:8px; font-size:13px; text-align:center;}
.ex-head{display:grid; grid-template-columns:1fr 64px 56px 56px; gap:8px; margin-bottom:6px;}
.ex-head span{font-size:10px; color:var(--text-dim); text-align:center; text-transform:uppercase;}
.ex-head span:first-child{text-align:left;}
.add-machine-row{display:flex; gap:8px; margin:10px 0 4px;}
.add-machine-row input{flex:1;}
.add-machine-row .btn{width:auto; white-space:nowrap; padding:10px 14px; font-size:13px;}

.history-item{padding:12px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.history-item:last-child{border-bottom:none;}
.history-date{font-weight:700; font-size:13px;}
.history-detail{font-size:12px; color:var(--text-dim); margin-top:3px; font-family:'IBM Plex Mono',monospace;}
.del-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; flex-shrink:0; padding:4px; display:flex; align-items:center;}
.del-btn svg{width:16px; height:16px;}

.tag{display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:4px 8px; border-radius:6px; background:var(--accent-dim); color:var(--accent); margin-right:6px;}
.tag.alt{background:var(--bg-input); color:var(--text-dim); border:1px solid var(--border);}

.program-card{
  background:var(--bg-card); border:1px solid var(--glass-border); border-radius:var(--radius-m); padding:16px; margin-bottom:14px;
  box-shadow:var(--glass-shadow); backdrop-filter:blur(18px) saturate(120%); -webkit-backdrop-filter:blur(18px) saturate(120%);
}
.program-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px;}
.step-edit-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.step-edit-row input{flex:1;}
.step-remove{
  width:32px; height:32px; flex-shrink:0; border-radius:50%; border:1px solid var(--glass-border);
  background:var(--bg-input); color:var(--text-dim); cursor:pointer; font-size:14px;
}
.program-title{font-family:'Unbounded',sans-serif; font-size:15px; font-weight:700; margin:0 0 4px;}
.program-count{font-size:11px; color:var(--text-dim);}
.step{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.step:last-child{border-bottom:none;}
.step-check{width:22px; height:22px; border-radius:7px; border:2px solid var(--glass-border); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--bg-input);}
.step-check.done{background:var(--accent); border-color:var(--accent);}
.step-check svg{width:13px; height:13px; opacity:0;}
.step-check.done svg{opacity:1;}
.step-label{font-size:14px; flex:1;}
.step.done .step-label{color:var(--text-dim); text-decoration:line-through;}

.settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-size:14px; font-weight:600;}
.settings-row .val{font-size:13px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;}

details.changelog-group{margin-bottom:10px;}
details.changelog-group summary{font-weight:800; font-size:13px; cursor:pointer; padding:8px 0; color:var(--text-dim);}
.changelog-entry{margin-bottom:12px;}
.changelog-entry .v{font-weight:800; font-size:13px; font-family:'IBM Plex Mono',monospace;}
.changelog-entry ul{margin:4px 0 0; padding-left:18px; font-size:13px; color:var(--text-dim);}

.toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--nav-margin)*2 + 16px + env(safe-area-inset-bottom));
  transform:translateX(-50%); background:var(--glass-bg-strong); border:1px solid var(--glass-border);
  color:var(--text); padding:12px 18px; border-radius:999px; font-family:'Manrope',sans-serif; font-size:13px; font-weight:600;
  box-shadow:var(--glass-shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  max-width:90%; text-align:center;
  backdrop-filter:blur(20px) saturate(130%); -webkit-backdrop-filter:blur(20px) saturate(130%);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.tabbar-wrap{
  position:fixed; left:0; right:0; z-index:30;
  bottom:calc(var(--nav-margin) + env(safe-area-inset-bottom));
  display:flex; justify-content:center; padding:0 var(--nav-margin);
  pointer-events:none;
}
nav.tabbar{
  position:relative; height:var(--nav-h); width:100%; max-width:532px;
  display:flex; align-items:stretch; padding:5px;
  border-radius:999px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  backdrop-filter:blur(24px) saturate(135%);
  -webkit-backdrop-filter:blur(24px) saturate(135%);
  pointer-events:auto;
}
.tab-pill{
  position:absolute; top:5px; bottom:5px; left:5px;
  width:96px; border-radius:999px;
  background:linear-gradient(155deg, rgba(255,255,255,.3), rgba(255,255,255,0)), var(--accent);
  box-shadow:0 6px 18px var(--accent-dim-2), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 6px rgba(0,0,0,.15);
  transition:left .38s cubic-bezier(.34,1.56,.4,1), width .38s cubic-bezier(.34,1.56,.4,1);
  z-index:0;
}
nav.tabbar .tab{
  position:relative; z-index:1;
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:none; border:none; color:var(--text-dim); font-family:'Manrope',sans-serif; font-size:9.5px; font-weight:700; cursor:pointer;
  transition:color .25s;
}
nav.tabbar .tab svg{width:19px; height:19px; transition:transform .25s;}
nav.tabbar .tab.active{color:#fff;}
nav.tabbar .tab.active svg{transform:translateY(-1px);}

.onboard-wrap{
  position:fixed; inset:0; background:var(--bg); z-index:200; overflow-y:auto;
  display:flex; align-items:flex-start; justify-content:center;
}
.onboard-inner{max-width:520px; width:100%; padding:40px 20px 60px;}
.onboard-hero{text-align:center; margin-bottom:26px;}
.onboard-hero .hero-logo{width:130px; margin:0 auto 10px; color:var(--navy-deep); filter:none;}
.onboard-hero .hero-logo svg path{fill:url(#onboardLogoGradient);}

.empty-state{text-align:center; padding:30px 10px; color:var(--text-dim);}
.empty-state .big{font-size:34px; margin-bottom:8px;}

/* Glow field — halftone lumineux façon inspiration, en bleu/violet */
.glow-field{
  position:fixed; left:0; right:0; bottom:0; height:280px; z-index:-1; pointer-events:none;
  -webkit-mask-image:radial-gradient(60% 90% at 50% 100%, black 0%, transparent 78%);
  mask-image:radial-gradient(60% 90% at 50% 100%, black 0%, transparent 78%);
  background-image:
    radial-gradient(circle at 46% 105%, var(--accent) 0%, transparent 55%),
    radial-gradient(circle at 68% 95%, var(--lavender) 0%, transparent 50%);
  opacity:.5; filter:blur(6px);
  animation:glowPulse 5s ease-in-out infinite;
}
.glow-dots{
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.6px);
  background-size:15px 15px;
  mix-blend-mode:overlay;
  -webkit-mask-image:radial-gradient(55% 85% at 50% 100%, black 0%, transparent 72%);
  mask-image:radial-gradient(55% 85% at 50% 100%, black 0%, transparent 72%);
}
@keyframes glowPulse{
  0%,100%{opacity:.4; transform:scale(1);}
  50%{opacity:.65; transform:scale(1.06);}
}

/* Boutons d'action flottants circulaires (FAB) */
.fab-row{display:flex; gap:20px; justify-content:center; margin:6px 0 20px;}
.fab-item{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; cursor:pointer; color:var(--text);}
.fab{
  width:64px; height:64px; border-radius:50%;
  background:linear-gradient(155deg, rgba(255,255,255,.28), rgba(255,255,255,0)), var(--accent);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 26px var(--accent-dim-2), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 8px rgba(0,0,0,.18);
  transition:transform .15s;
}
.fab-item:active .fab{transform:scale(.92);}
.fab svg{width:26px; height:26px; color:#fff;}
.fab-item span{font-size:11px; font-weight:700; color:var(--text-dim);}

/* Statistiques */
.stat-note{font-size:12px; color:var(--text-dim); margin-top:10px; font-family:'IBM Plex Mono',monospace;}
.week-chart{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.week-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:34px;}
.week-bars{display:flex; align-items:flex-end; gap:3px; height:58px;}
.week-bar{width:9px; border-radius:4px 4px 2px 2px;}
.week-bar.gym{background:var(--accent);}
.week-bar.run{background:var(--accent-2);}
.week-col span{font-size:9px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;}
.legend{display:flex; gap:16px; margin-top:12px;}
.legend span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
.legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
.legend .dot.gym{background:var(--accent);}
.legend .dot.run{background:var(--accent-2);}
.sparkline{width:100%; height:64px; display:block; margin-top:6px;}
.sparkline.spark-accent polyline, .sparkline.spark-accent circle{stroke:var(--accent); fill:var(--accent);}
.sparkline.spark-accent2 polyline, .sparkline.spark-accent2 circle{stroke:var(--accent-2); fill:var(--accent-2);}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="onboardLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d58"/>
      <stop offset="100%" stop-color="#5c639a"/>
    </linearGradient>
  </defs>
</svg>
<div class="glow-field"><div class="glow-dots"></div></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const APP_NAME = "Sport";
const APP_VERSION = "0.0.3";
const REPO_VERSION_URL = "./version.json";

const MACHINES = [
  {id:"chestPress", label:"Chest press"},
  {id:"lowRow", label:"Low row"},
  {id:"shoulderPress", label:"Shoulder press"},
  {id:"pectoral", label:"Pectoral"},
  {id:"tractionVerticale", label:"Traction verticale"},
  {id:"adducteur", label:"Adducteur"},
  {id:"adducteurExt", label:"Adducteur ext."},
  {id:"proneLegCurl", label:"Prone leg curl"},
];

const RUN_TYPES = [

/* ============ UTIL ============ */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("fr-FR", {day:"2-digit", month:"short", year:"numeric"});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function startOfWeek(){
  const d = new Date();
  const day = (d.getDay()+6)%7; // Monday=0
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-day);
  return d;
}
function showToast(msg, ms=2200){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), ms);
}

/* ============ RECORDS ============ */
function machinePR(machineId){
  let max = 0;
  state.gym.forEach(s=>{
    const e = s.exercises[machineId];
    if(e && e.poids && parseFloat(e.poids) > max) max = parseFloat(e.poids);
  });
  return max;
}
function runStats(){
  if(state.runs.length===0) return {bestPace:null, longest:0, totalKm:0};
  let bestPace = Infinity, longest = 0, totalKm = 0;
  state.runs.forEach(r=>{
    const dist = parseFloat(r.distance)||0;
    const dur = parseFloat(r.duree)||0;
    totalKm += dist;
    if(dist > longest) longest = dist;
    if(dist>0 && dur>0){
      const pace = dur/dist;
      if(pace < bestPace) bestPace = pace;
    }
  });
  return {bestPace: bestPace===Infinity?null:bestPace, longest, totalKm};
}
function paceStr(paceMinPerKm){
  if(paceMinPerKm==null) return "—";
  const m = Math.floor(paceMinPerKm);
  const s = Math.round((paceMinPerKm - m)*60);
  return `${m}'${s.toString().padStart(2,"0")}"/km`;
}
function weekSummary(){
  const sow = startOfWeek();
  const gymCount = state.gym.filter(s=> new Date(s.date+"T00:00:00") >= sow).length;
  const kmWeek = state.runs.filter(r=> new Date(r.date+"T00:00:00") >= sow)
    .reduce((a,r)=>a+(parseFloat(r.distance)||0),0);
  return {gymCount, kmWeek};
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById("app");
  if(!state.profile || !state.profile.onboarded){
    app.innerHTML = renderOnboarding();
    bindOnboarding();
    return;
  }
  app.innerHTML = `
    ${state.screen==='home' ? '' : `<div class="pagehead"><span>${screenTitle()}</span></div>`}
    <main class="screen" id="mainContent"></main>
    <div class="tabbar-wrap">
      <nav class="tabbar">
        <div class="tab-pill" id="tabPill"></div>
        ${tab('home', ICONS.home, 'Accueil')}
        ${tab('gym', ICONS.dumbbell, 'Salle')}
        ${tab('run', ICONS.run, 'Course')}
        ${tab('stats', ICONS.stats, 'Stats')}
        ${tab('programs', ICONS.list, 'Progr.')}
      </nav>
    </div>
  `;
  document.getElementById("mainContent").innerHTML = renderScreen();
  document.querySelectorAll("nav.tabbar .tab").forEach(b=>{
    b.addEventListener("click", ()=>{ state.screen = b.dataset.screen; window.scrollTo(0,0); render(); });
  });
  bindScreen();
  positionTabPill();
}
function screenTitle(){
  return {gym:"Salle de sport", run:"Course", stats:"Statistiques", programs:"Programmes", settings:"Réglages"}[state.screen] || "SPORT";
}
function tab(id, icon, label){
  return `<button class="tab ${state.screen===id?'active':''}" data-screen="${id}">${icon}<span>${label}</span></button>`;
}
function positionTabPill(){
  const nav = document.querySelector("nav.tabbar");
  const pill = document.getElementById("tabPill");
  if(!nav || !pill) return;
  const active = nav.querySelector(".tab.active");
  if(!active) return;
  pill.style.left = active.offsetLeft + "px";
  pill.style.width = active.offsetWidth + "px";
}
window.addEventListener("resize", positionTabPill);

function renderScreen(){
  if(state.screen==="home") return renderHome();
  if(state.screen==="gym") return renderGym();
  if(state.screen==="run") return renderRun();
  if(state.screen==="stats") return renderStats();
  if(state.screen==="programs") return renderPrograms();
  if(state.screen==="settings") return renderSettings();
  return "";
}
function bindScreen(){
  if(state.screen==="home") bindHome();
  if(state.screen==="gym") bindGym();
  if(state.screen==="run") bindRun();
  if(state.screen==="stats") bindStats();
  if(state.screen==="programs") bindPrograms();
  if(state.screen==="settings") bindSettings();
}

let statsMachine = null;
function getWeekKey(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = (d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function weeklyVolume(n){
  const weeks = [];
  const now = new Date();
  const day = (now.getDay()+6)%7;
  now.setHours(0,0,0,0); now.setDate(now.getDate()-day);
  for(let i=n-1;i>=0;i--){
    const start = new Date(now); start.setDate(start.getDate()-7*i);
    weeks.push({key:start.toISOString().slice(0,10), start, gym:0, run:0, km:0});
  }
  state.gym.forEach(s=>{ const k=getWeekKey(s.date); const w=weeks.find(w=>w.key===k); if(w) w.gym++; });
  state.runs.forEach(r=>{ const k=getWeekKey(r.date); const w=weeks.find(w=>w.key===k); if(w){ w.run++; w.km += parseFloat(r.distance)||0; } });
  return weeks;
}
function machineSeries(machineId){
  return state.gym.filter(s=>s.exercises[machineId] && s.exercises[machineId].poids)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(s=>({date:s.date, poids:parseFloat(s.exercises[machineId].poids)}));
}
function sparklineSVG(values, colorClass){
  if(values.length<2) return "";
  const w=300,h=64,pad=6;
  const max=Math.max(...values), min=Math.min(...values);
  const range=(max-min)||1;
  const step=(w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x=pad+i*step;
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return {x,y};
  });
  const line = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="sparkline ${colorClass}"><polyline points="${line}" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function renderStats(){
  const totalGym = state.gym.length;
  const totalKm = state.runs.reduce((a,r)=>a+(parseFloat(r.distance)||0),0);
  const totalPrograms = Object.values(state.progress).reduce((a,p)=>a+(p.sessions||0),0);
  const weeks = weeklyVolume(8);
  const maxWeek = Math.max(1, ...weeks.map(w=>Math.max(w.gym,w.run)));
  const machinesWithData = allMachines().filter(m=>machineSeries(m.id).length>=2);
  if(!statsMachine || !machinesWithData.find(m=>m.id===statsMachine)){
    statsMachine = machinesWithData[0] ? machinesWithData[0].id : null;
  }
  const series = statsMachine ? machineSeries(statsMachine) : [];
  const paceRuns = [...state.runs].sort((a,b)=>a.date.localeCompare(b.date))
    .filter(r=>parseFloat(r.distance)>0 && parseFloat(r.duree)>0);
  const paceSeries = paceRuns.map(r=> -(parseFloat(r.duree)/parseFloat(r.distance)));
  const fcRuns = state.runs.filter(r=>r.fc);
  const avgFc = fcRuns.length ? Math.round(fcRuns.reduce((a,r)=>a+parseFloat(r.fc),0)/fcRuns.length) : null;

  return `
    <div class="card">
      <h2>Vue d'ensemble</h2>
      <div class="row-stats">
        <div class="stat"><b>${totalGym}</b><span>séances salle</span></div>
        <div class="stat"><b>${totalKm.toFixed(1)}</b><span>km course</span></div>
        <div class="stat"><b>${totalPrograms}</b><span>programmes finis</span></div>
      </div>
      ${avgFc ? `<div class="stat-note">FC moyenne sur tes courses : ${avgFc} bpm</div>` : ""}
    </div>

    <div class="card">
      <h2>Volume hebdomadaire (8 semaines)</h2>
      <div class="week-chart">
        ${weeks.map(w=>`
          <div class="week-col">
            <div class="week-bars">
              <div class="week-bar gym" style="height:${Math.max(3,Math.round((w.gym/maxWeek)*54))}px"></div>
              <div class="week-bar run" style="height:${Math.max(3,Math.round((w.run/maxWeek)*54))}px"></div>
            </div>
            <span>${new Date(w.start+"T00:00:00").toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</span>
          </div>`).join("")}
      </div>
      <div class="legend"><span><i class="dot gym"></i>Salle</span><span><i class="dot run"></i>Course</span></div>
    </div>

    <div class="card">
      <h2>Progression par machine</h2>
      ${machinesWithData.length===0 ? emptyState("📈","Pas encore assez de données (2 séances min. par machine)") : `
        <div class="choice-group" id="statsMachineChoice">
          ${machinesWithData.map(m=>`<div class="choice ${m.id===statsMachine?'active':''}" data-val="${m.id}">${m.label}</div>`).join("")}
        </div>
        ${sparklineSVG(series.map(s=>s.poids), 'spark-accent')}
        <div class="stat-note">De ${series[0]?.poids ?? '—'} kg à ${series[series.length-1]?.poids ?? '—'} kg</div>
      `}
    </div>

    <div class="card">
      <h2>Progression allure course</h2>
      ${paceSeries.length<2 ? emptyState("🏃","Pas encore assez de courses enregistrées") : `
        ${sparklineSVG(paceSeries, 'spark-accent2')}
        <div class="stat-note">Courbe qui monte = tu deviens plus rapide</div>
      `}
    </div>
  `;
}
function bindStats(){
  const group = document.getElementById("statsMachineChoice");
  if(group){
    group.querySelectorAll(".choice").forEach(c=>{
      c.addEventListener("click", ()=>{ statsMachine = c.dataset.val; render(); });
    });
  }
}

function bindPrograms(){

    render();
  });

    document.getElementById("progTitle").addEventListener("input", e=>{ programDraftTitle = e.target.value; });

      btn.addEventListener("click", ()=>{ programDraftSteps.splice(parseInt(btn.dataset.removeIdx),1); render(); });
    });
    document.getElementById("addStepBtn").addEventListener("click", ()=>{ programDraftSteps.push(""); render(); });

      save(K.programsList, state.programsList);

      showToast("Programme créé 🎉");
      render();
    });

        state.programsList = state.programsList.filter(p=>p.id!==pid);
        delete state.progress[pid];
        save(K.programsList, state.programsList);
        save(K.progress, state.progress);
        render();
      }
    });
  });
  document.querySelectorAll(".step-check").forEach(el=>{
    el.addEventListener("click", ()=>{
      const pid = el.dataset.prog, idx = parseInt(el.dataset.idx);
      if(!state.progress[pid]) state.progress[pid] = {done:[], sessions:0};
      const done = state.progress[pid].done;
      const pos = done.indexOf(idx);
      if(pos>-1) done.splice(pos,1); else done.push(idx);
      save(K.progress, state.progress);
      render();
    });
  });
  document.querySelectorAll("[data-finish]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const pid = el.dataset.finish;
      state.progress[pid].sessions += 1;
      state.progress[pid].done = [];
      save(K.progress, state.progress);
      showToast("Séance terminée, bravo ! 🎉");
      render();
    });
  });
}

/* ============ UPDATE CHECK ============ */
function checkForUpdate(manual){
  const btn = document.getElementById("checkUpdateBtn");
  if(btn) btn.classList.add("spinning");
  fetch(REPO_VERSION_URL + "?t=" + Date.now(), {cache:"no-store"})
    .then(r=> r.ok ? r.json() : null)
    .then(data=>{
      if(btn) btn.classList.remove("spinning");
      if(!data || !data.version){
        if(manual) showToast("Impossible de vérifier (hors ligne ?)");
        return;
      }
      const lastSeen = localStorage.getItem(K.lastVersion) || APP_VERSION;
      if(data.version !== APP_VERSION){
        const alreadyReloading = sessionStorage.getItem("sport_reloading");
        if(!alreadyReloading){
          sessionStorage.setItem("sport_reloading","1");
          showToast("Nouvelle version disponible, mise à jour…");
          setTimeout(()=> location.reload(true), 800);
        } else if(manual){
          showToast("Une nouvelle version (" + data.version + ") est disponible, réessaie de recharger.");
        }
      } else {
        sessionStorage.removeItem("sport_reloading");
        if(manual) showToast("Tu as déjà la dernière version (" + APP_VERSION + ")");
      }
    })
    .catch(()=>{
      if(btn) btn.classList.remove("spinning");
      if(manual) showToast("Impossible de vérifier (hors ligne ?)");
    });
}

/* ============ BOOT ============ */
render();
checkForUpdate(false);

if ("serviceWorker" in navigator) {
  // pas de service worker dédié : on garde le fetch manuel ci-dessus pour rester simple et fiable
}
</script>
</body>
</html>
